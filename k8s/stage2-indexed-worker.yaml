apiVersion: batch/v1
kind: Job
metadata:
  name: valhallaroute-tile-workers
  labels:
    app.kubernetes.io/name: valhallaroute
    app.kubernetes.io/component: tile-worker
spec:
  completionMode: Indexed
  completions: 16                # Matches tasks generated in manifest.jsonl
  parallelism: 8                 # Max concurrent worker pods
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valhallaroute
        app.kubernetes.io/component: tile-worker
    spec:
      restartPolicy: OnFailure
      serviceAccountName: valhallaroute
      containers:
        - name: tile-builder
          image: ghcr.io/valhallaroute:v0.4.0
          imagePullPolicy: IfNotPresent
          args:
            - "run-worker"
            - "--manifest"
            - "azure://valhalla-tiles/manifests/tiles_tasks.jsonl"
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - name: AZURE_STORAGE_ACCOUNT_NAME
              value: "valhallastorage"
          resources:
            requests:
              cpu: "8"
              memory: "16Gi"
            limits:
              cpu: "8"
              memory: "16Gi"
