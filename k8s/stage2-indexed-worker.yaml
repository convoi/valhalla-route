apiVersion: batch/v1
kind: Job
metadata:
  name: valhallaroute-tile-workers
  labels:
    app.kubernetes.io/name: valhallaroute
    app.kubernetes.io/component: tile-worker
spec:
  completionMode: Indexed
  # Note: Set completions to the exact number of lines produced by the planner manifest.
  # Orchestrators (Airflow, Dagster, Argo, or kubectl) populate this dynamically.
  completions: 16
  parallelism: 8
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valhallaroute
        app.kubernetes.io/component: tile-worker
    spec:
      restartPolicy: OnFailure
      serviceAccountName: valhallaroute
      containers:
        - name: tile-builder
          image: ghcr.io/valhallaroute:latest
          imagePullPolicy: IfNotPresent
          args:
            - "run-worker"
            - "--manifest"
            - "azure://valhalla-tiles/manifests/tiles_tasks.jsonl"
            # Optional override: if not set, worker reads admin_db_uri from task manifest
            # - "--admin-db-uri"
            # - "azure://valhalla-tiles/admin.sqlite"
            # Optional scratch temp directory (uses high-speed emptyDir volume)
            - "--temp-dir"
            - "/tmp/valhalla-build"
          env:
            # Kubernetes 1.21+ indexed job completion index
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            # Azure Blob Storage (via Workload Identity or storage account key)
            - name: AZURE_STORAGE_ACCOUNT_NAME
              value: "valhallastorage"
            # AWS S3 alternative env vars:
            # - name: AWS_REGION
            #   value: "eu-central-1"
          resources:
            # Guaranteed QoS (requests == limits) prevents CPU throttling and node OOM-kills
            requests:
              cpu: "8"
              memory: "16Gi"
            limits:
              cpu: "8"
              memory: "16Gi"
          volumeMounts:
            - name: build-scratch
              mountPath: /tmp/valhalla-build
      volumes:
        - name: build-scratch
          emptyDir: {}
