apiVersion: batch/v1
kind: Job
metadata:
  name: valhallaroute-plan-batch
  labels:
    app.kubernetes.io/name: valhallaroute
    app.kubernetes.io/component: batch-planner
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valhallaroute
        app.kubernetes.io/component: batch-planner
    spec:
      restartPolicy: OnFailure
      serviceAccountName: valhallaroute
      containers:
        - name: planner
          image: ghcr.io/valhallaroute:latest
          imagePullPolicy: IfNotPresent
          args:
            - "plan-batch"
            # Target regions or wildcards (e.g. "europe/*", "germany/*", "bayern")
            - "--regions"
            - "germany/*"
            # Destination task manifest JSONL
            - "--manifest"
            - "azure://valhalla-tiles/manifests/tiles_tasks.jsonl"
            # Target storage prefix for compiled .gph tiles
            - "--output"
            - "azure://valhalla-tiles/global/"
            # Auto-subdivide mega-regions into child extracts
            - "--auto-subdivide"
            - "--max-tiles"
            - "300"
            # Bin-pack small extracts (< min-tiles) into balanced worker tasks
            - "--bin-pack"
            - "--target-tiles"
            - "200"
            - "--min-tiles"
            - "50"
            # Compile admin.sqlite from Overture Maps and upload to storage root
            - "--admin-boundaries"
            # Optional: specify explicit country ISO-3166-1 alpha-2 codes (defaults to auto-detected)
            # - "--admin-countries"
            # - "DE"
            # - "FR"
            # - "NL"
          env:
            # Azure Blob Storage (via Workload Identity or storage account key)
            - name: AZURE_STORAGE_ACCOUNT_NAME
              value: "valhallastorage"
            # AWS S3 alternative env vars:
            # - name: AWS_REGION
            #   value: "eu-central-1"
            # - name: AWS_DEFAULT_REGION
            #   value: "eu-central-1"
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
