apiVersion: batch/v1
kind: Job
metadata:
  name: valhallaroute-plan-batch
  labels:
    app.kubernetes.io/name: valhallaroute
    app.kubernetes.io/component: batch-planner
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valhallaroute
        app.kubernetes.io/component: batch-planner
    spec:
      restartPolicy: OnFailure
      containers:
        - name: planner
          image: ghcr.io/valhallaroute:v0.4.0
          imagePullPolicy: IfNotPresent
          args:
            - "plan-batch"
            - "--regions"
            - "germany/*"
            - "--manifest"
            - "s3://valhalla-tiles/manifests/tiles_tasks.jsonl"
            - "--output"
            - "s3://valhalla-tiles/global/"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
