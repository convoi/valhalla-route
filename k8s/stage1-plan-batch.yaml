apiVersion: batch/v1
kind: Job
metadata:
  name: valhallaroute-plan-batch
  labels:
    app.kubernetes.io/name: valhallaroute
    app.kubernetes.io/component: batch-planner
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valhallaroute
        app.kubernetes.io/component: batch-planner
    spec:
      restartPolicy: OnFailure
      serviceAccountName: valhallaroute
      containers:
        - name: planner
          image: ghcr.io/valhallaroute:v0.4.0
          imagePullPolicy: IfNotPresent
          args:
            - "plan-batch"
            - "--regions"
            - "germany/*"
            - "--manifest"
            - "azure://valhalla-tiles/manifests/tiles_tasks.jsonl"
            - "--output"
            - "azure://valhalla-tiles/global/"
          env:
            - name: AZURE_STORAGE_ACCOUNT_NAME
              value: "valhallastorage"
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
