{{- if .Values.worker.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "valhallaroute.fullname" . }}-workers
  labels:
    {{- include "valhallaroute.labels" . | nindent 4 }}
    app.kubernetes.io/component: tile-worker
  {{- with .Values.worker.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  completionMode: Indexed
  completions: {{ .Values.worker.completions }}
  parallelism: {{ .Values.worker.parallelism }}
  backoffLimit: {{ .Values.worker.backoffLimit }}
  {{- if .Values.worker.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ .Values.worker.ttlSecondsAfterFinished }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "valhallaroute.labels" . | nindent 8 }}
        app.kubernetes.io/component: tile-worker
        {{- if .Values.azure.workloadIdentity.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
        {{- with .Values.worker.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.worker.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "valhallaroute.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: tile-builder
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "run-worker"
            - "--manifest"
            - {{ .Values.worker.manifestUri | quote }}
            {{- if .Values.worker.tileStorageUri }}
            - "--tile-storage-uri"
            - {{ .Values.worker.tileStorageUri | quote }}
            {{- end }}
            {{- if .Values.worker.adminDbUri }}
            - "--admin-db-uri"
            - {{ .Values.worker.adminDbUri | quote }}
            {{- end }}
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            {{- if .Values.azure.storageAccountName }}
            - name: AZURE_STORAGE_ACCOUNT_NAME
              value: {{ .Values.azure.storageAccountName | quote }}
            {{- end }}
            {{- if and .Values.azure.workloadIdentity.enabled .Values.azure.workloadIdentity.tenantId }}
            - name: AZURE_TENANT_ID
              value: {{ .Values.azure.workloadIdentity.tenantId | quote }}
            {{- end }}
            {{- with .Values.worker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          {{- with .Values.worker.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.worker.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
