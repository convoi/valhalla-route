{{- if .Values.planner.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "valhallaroute.fullname" . }}-planner
  labels:
    {{- include "valhallaroute.labels" . | nindent 4 }}
    app.kubernetes.io/component: batch-planner
  {{- with .Values.planner.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  backoffLimit: {{ .Values.planner.backoffLimit }}
  {{- if .Values.planner.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ .Values.planner.ttlSecondsAfterFinished }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "valhallaroute.labels" . | nindent 8 }}
        app.kubernetes.io/component: batch-planner
        {{- if .Values.azure.workloadIdentity.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
        {{- with .Values.planner.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.planner.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "valhallaroute.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: planner
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "plan-batch"
            {{- if .Values.planner.regionsFileContent }}
            - "--regions-file"
            - "/etc/valhallaroute/regions.txt"
            {{- else if .Values.planner.regions }}
            - "--regions"
            {{- range .Values.planner.regions }}
            - {{ . | quote }}
            {{- end }}
            {{- end }}
            - "--manifest"
            - {{ .Values.planner.manifestUri | quote }}
            - "--output"
            - {{ .Values.planner.outputUri | quote }}
            {{- if .Values.planner.autoSubdivide }}
            - "--auto-subdivide"
            - "--max-tiles"
            - {{ .Values.planner.maxTilesPerJob | quote }}
            {{- else }}
            - "--no-auto-subdivide"
            {{- end }}
            {{- if .Values.planner.binPack }}
            - "--bin-pack"
            - "--target-tiles"
            - {{ .Values.planner.targetTilesPerJob | quote }}
            - "--min-tiles"
            - {{ .Values.planner.minTilesPerJob | quote }}
            {{- else }}
            - "--no-bin-pack"
            {{- end }}
            {{- if .Values.adminBoundaries.enabled }}
            - "--admin-boundaries"
            {{- if .Values.adminBoundaries.countries }}
            - "--admin-countries"
            {{- range .Values.adminBoundaries.countries }}
            - {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
          env:
            {{- if .Values.azure.storageAccountName }}
            - name: AZURE_STORAGE_ACCOUNT_NAME
              value: {{ .Values.azure.storageAccountName | quote }}
            {{- end }}
            {{- if and .Values.azure.workloadIdentity.enabled .Values.azure.workloadIdentity.tenantId }}
            - name: AZURE_TENANT_ID
              value: {{ .Values.azure.workloadIdentity.tenantId | quote }}
            {{- end }}
            {{- with .Values.planner.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.planner.resources | nindent 12 }}
          {{- if .Values.planner.regionsFileContent }}
          volumeMounts:
            - name: regions-config
              mountPath: /etc/valhallaroute
              readOnly: true
          {{- end }}
      {{- if .Values.planner.regionsFileContent }}
      volumes:
        - name: regions-config
          configMap:
            name: {{ include "valhallaroute.fullname" . }}-regions
      {{- end }}
      {{- with .Values.planner.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.planner.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.planner.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
