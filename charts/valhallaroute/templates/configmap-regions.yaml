{{- if and .Values.planner.enabled .Values.planner.regionsFileContent -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "valhallaroute.fullname" . }}-regions
  labels:
    {{- include "valhallaroute.labels" . | nindent 4 }}
    app.kubernetes.io/component: batch-planner
data:
  regions.txt: |
    {{- .Values.planner.regionsFileContent | nindent 4 }}
{{- end }}
