{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "valhallaroute.serviceAccountName" . }}
  labels:
    {{- include "valhallaroute.labels" . | nindent 4 }}
    {{- if .Values.azure.workloadIdentity.enabled }}
    azure.workload.identity/use: "true"
    {{- end }}
    {{- with .Values.serviceAccount.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- if and .Values.azure.workloadIdentity.enabled .Values.azure.workloadIdentity.clientId }}
    azure.workload.identity/client-id: {{ .Values.azure.workloadIdentity.clientId | quote }}
    {{- end }}
    {{- if and .Values.azure.workloadIdentity.enabled .Values.azure.workloadIdentity.tenantId }}
    azure.workload.identity/tenant-id: {{ .Values.azure.workloadIdentity.tenantId | quote }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
