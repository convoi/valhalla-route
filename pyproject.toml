[project]
name = "valhallaroute"
version = "0.8.0"
description = "Add your description here"
readme = "README.md"
license = "Unlicense"
requires-python = ">=3.12"
dependencies = [
    "osmium>=4.3.2",
    "pandas>=3.1.1",
    "pyproj>=3.8.0",
    "pyvalhalla>=3.9.1",
    "requests>=2.34.2",
    "obstore>=0.12.0",
    "pyarrow>=15.0.0",
    "duckdb>=2.0.0",
    "shapely>=2.2.0",
    "scipy>=1.12.0",
]

[project.scripts]
valhallaroute = "valhallaroute.cli:main"

[dependency-groups]
dev = [
    "psutil>=7.2.2",
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["valhallaroute"]

[tool.pytest.ini_options]
addopts = "--basetemp=.tmp_pytest -o cache_dir=.tmp_cache"
